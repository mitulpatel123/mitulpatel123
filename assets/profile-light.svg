<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Mitul Patel engineering profile</title>
  <desc id="desc">A futuristic systems map for cloud, backend, data, and applied AI engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.58" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".16"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#334155" stroke-opacity=".07"/>
    </pattern>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="905" cy="210" r="285" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="url(#edge)" stroke-opacity=".65"/>
  <path d="M58 74H333" stroke="url(#edge)" stroke-width="3"/>
  <circle cx="58" cy="74" r="5" fill="#0891b2"/>
  <text x="58" y="116" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" letter-spacing="4">ENGINEERING PROFILE / 2027</text>
  <text x="56" y="184" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="61" font-weight="750" letter-spacing="1">MITUL PATEL</text>
  <text x="59" y="225" fill="#0e7490" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">cloud · backend · data · applied AI</text>
  <text x="59" y="280" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Building reliable systems with visible engineering evidence.</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#334155">
    <rect x="58" y="320" width="145" height="36" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-opacity=".55"/>
    <text x="85" y="343">PYTHON / API</text>
    <rect x="216" y="320" width="143" height="36" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-opacity=".55"/>
    <text x="246" y="343">CLOUD / DATA</text>
    <rect x="372" y="320" width="157" height="36" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-opacity=".55"/>
    <text x="398" y="343">ML / EVALUATION</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <circle cx="940" cy="208" r="111" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 9"/>
    <circle cx="940" cy="208" r="72" fill="none" stroke="#0891b2" stroke-opacity=".32"/>
    <circle cx="940" cy="208" r="15" fill="#06b6d4" filter="url(#soft)" opacity=".4"/>
    <circle cx="940" cy="208" r="7" fill="#0891b2"/>
    <path d="M940 208L834 158M940 208l104-52M940 208l79 87M940 208L846 299" stroke="#94a3b8" stroke-width="1.5"/>
    <g font-size="12" text-anchor="middle">
      <circle cx="834" cy="158" r="24" fill="#ecfeff" stroke="#0891b2"/>
      <text x="834" y="162" fill="#0e7490">API</text>
      <circle cx="1044" cy="156" r="28" fill="#f5f3ff" stroke="#7c3aed"/>
      <text x="1044" y="160" fill="#6d28d9">DATA</text>
      <circle cx="1019" cy="295" r="25" fill="#f0fdfa" stroke="#0f766e"/>
      <text x="1019" y="299" fill="#0f766e">ML</text>
      <circle cx="846" cy="299" r="28" fill="#eff6ff" stroke="#2563eb"/>
      <text x="846" y="303" fill="#1d4ed8">CLOUD</text>
    </g>
    <text x="940" y="374" text-anchor="middle" fill="#64748b" font-size="12" letter-spacing="3">SHIP · MEASURE · EXPLAIN</text>
  </g>
  <circle cx="1044" cy="114" r="4" fill="#0f766e">
    <animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>
